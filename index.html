<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Photo preview WhatsApp</title>

  <!-- Open Graph pour WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Clique pour ouvrir l’image" />
  <meta property="og:description" content="Aperçu envoyé depuis GitHub Pages" />

  <!-- ⚠️ MET TON IMAGE ICI -->
  <meta property="og:image" content="https://raw.githubusercontent.com/github/explore/main/topics/html/html.png" />

  <!-- Ton lien GitHub Pages -->
  <meta property="og:url" content="https://abdessadeqmakkioui.github.io/TON-REPO" />

  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: #f2f2f2;
      padding: 40px;
    }
    img {
      max-width: 90%;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
  </style>
</head>

<body>
  <h1>Aperçu WhatsApp</h1>
  <p>Voici l’image qui s’affichera dans WhatsApp :</p>

  <!-- ⚠️ MET LA MÊME IMAGE ICI -->

</html>
