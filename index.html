<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ma page de partage</title>

  <!-- Open Graph (WhatsApp utilise ces balises) -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://example.com/ma-page" />
  <meta property="og:title"       content="Titre attractif de la page" />
  <meta property="og:description" content="Courte description qui apparaîtra dans la prévisualisation." />
  <meta property="og:image"       content="https://example.com/images/preview.jpg" />
  <!-- Taille recommandée pour og:image : 1200 x 630 (ratio 1.91:1) -->
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- (optionnel) Twitter Card fallback -->
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
  <h1>Ma page</h1>
  <p>Contenu de la page…</p>
</body>
</html>
